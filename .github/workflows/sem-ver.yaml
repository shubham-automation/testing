name: Semantic Release

on:
  workflow_dispatch:
    branches:
      - main
      - rel/[0-9]+.[0-9]+.[0-9]+  # Match rel/x.x.x branches

# concurrency:
#   group: semantic-release-${{ github.ref }}
#   cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For pushing commits and tags
      issues: write    # For GitHub release notes
      pull-requests: write  # For release management

    steps:
      # Validate version.txt format
      - name: Validate version.txt
        run: |
          if ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' version.txt; then
            echo "Error: version.txt does not contain a valid semantic version (e.g., 1.0.0)"
            exit 1
          fi

      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for commit analysis

      # Set up git configuration
      - name: Set up git
        run: |
          git config user.name "${{ secrets.GIT_USERNAME }}"
          git config user.email "${{ secrets.GIT_EMAIL }}"

      # Run semantic-release using Docker
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          docker run \
            --rm \
            -e GITHUB_TOKEN \
            -v $(pwd):/usr/src/app \
            semantic-release/semantic-release \
            --no-ci
